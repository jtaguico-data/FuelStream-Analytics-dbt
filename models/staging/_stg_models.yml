version: 2
models:
  - name: stg_clients_01
    description: "Staging table for client data source 01."
    columns:
      - name: person_id
        description: "Unique identifier for the client."
        tests:
          - not_null
      - name: birth_date
        description: "Client date of birth."
      - name: gender
        description: "Numeric code representing client gender."
      - name: receives_email
        description: "Flag indicating if the client opted into email communications."
      - name: account_number
        description: "Unique account identifier."
      - name: registered_at
        description: "Timestamp when the client account was created."
      - name: member_status
        description: "Current membership tier or status code."
      - name: account_type
        description: "Classification of the client account."
      - name: file_date
        description: "Date the source file was processed."
      - name: updated_at
        description: "Timestamp of the last record modification."
      - name: email_status
        description: "Current status of the client's email address."
      - name: is_domain_valid
        description: "Flag indicating if the email domain is verified."

  - name: stg_clients_02
    description: "Staging table for client data source 02."
    columns:
      - name: person_id
        description: "Unique identifier for the client."
        tests:
          - not_null
      - name: birth_date
        description: "Client date of birth."
      - name: gender
        description: "Numeric code representing client gender."
      - name: receives_email
        description: "Flag indicating if the client opted into email communications."
      - name: account_number
        description: "Unique account identifier."
      - name: registered_at
        description: "Timestamp when the client account was created."
      - name: member_status
        description: "Current membership tier or status code."
      - name: account_type
        description: "Classification of the client account."
      - name: file_date
        description: "Date the source file was processed."
      - name: updated_at
        description: "Timestamp of the last record modification."
      - name: email_status
        description: "Current status of the client's email address."
      - name: is_domain_valid
        description: "Flag indicating if the email domain is verified."

  - name: stg_transactions
    description: "Staging table for raw transaction data."
    columns:
      - name: transaction_id
        description: "Unique identifier for the transaction."
        tests:
          - not_null
      - name: process
        description: "The internal process name that generated the transaction."
      - name: user_id
        description: "Identifier for the user performing the transaction."
      - name: product_id
        description: "Identifier for the product purchased."
      - name: quantity
        description: "Number of units involved in the transaction."
      - name: points
        description: "Loyalty points associated with the transaction."
      - name: site_id
        description: "Identifier for the site where the transaction occurred."
      - name: registered_at
        description: "Timestamp of registration related to the transaction."
      - name: transaction_channel_id
        description: "Identifier for the sales channel."
      - name: transacted_at
        description: "Timestamp when the transaction was completed."
      - name: person_id
        description: "Identifier for the client associated with the transaction."